<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محاكاة نوادي الأجيال | محتواي</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Layout: شريط جهات بالأعلى، ثم لكل جهة إطار (جوال أو شاشة لوحة) وبجانبه قائمة الخطوات */
:root{
  --teal:#2BBCB3; --teal-d:#0E7C75; --purple:#9B2D8E; --gold:#ECB831; --gold-d:#8A6400;
  --navy:#1A3A5C; --pink:#E84B6A; --green:#0D7C66; --bg:#F7F9FC; --surface:#FFFFFF;
  --line:#E3E8EF; --muted:#617080; --soft:#F0F2F5; --tint:#E6F7F6;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--navy);font-family:var(--font);font-size:15px;line-height:1.6;direction:rtl}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}

/* رأس الصفحة */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top img{height:56px;width:auto}
.top h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#FFF6DC;color:var(--gold-d);border:1px solid #F3DA8E;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}

/* شريط الجهات */
.roles{display:flex;gap:8px;margin:18px 0 16px;overflow-x:auto;padding-bottom:4px}
.roles button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--navy);border-radius:14px;padding:10px 16px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
.roles button small{font-weight:600;color:var(--muted);font-size:12px}
.roles button[aria-selected="true"]{border-color:var(--teal);background:linear-gradient(135deg,var(--teal),#3a8fb7 60%,var(--purple));color:#fff}
.roles button[aria-selected="true"] small{color:#E9FBFA}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.stage.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}

/* قائمة الخطوات */
.steps{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.steps h3{margin:0 0 4px;font-size:15px}
.steps .hint{margin:0 0 8px;color:var(--muted);font-size:13px}
.steps button{display:flex;gap:10px;align-items:flex-start;text-align:right;border:0;background:transparent;border-radius:12px;padding:8px 10px;color:var(--navy);font-size:14px;font-weight:600}
.steps button .n{flex:0 0 24px;height:24px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.steps button.on{background:var(--tint)}
.steps button.on .n{background:var(--teal);color:#fff}
.steps button span.t{display:block}
.steps button span.d{display:block;font-weight:400;color:var(--muted);font-size:12.5px}

/* إطار الجوال */
.phoneWrap{display:flex;justify-content:center}
.phone{width:min(390px,100%);height:760px;max-height:calc(100vh - 40px);min-height:620px;background:#0d1b2a;border-radius:44px;padding:10px;box-shadow:0 20px 50px rgba(26,58,92,.22)}
.screen{position:relative;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;display:flex;flex-direction:column}
.sbar{height:30px;flex:0 0 30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700;color:var(--navy)}
.appbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px 12px;background:linear-gradient(135deg,var(--teal),#3a8fb7 60%,var(--purple));color:#fff}
.appbar h2{margin:0;font-size:17px;font-weight:800;flex:1}
.appbar .back{border:0;background:rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1}
.body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.toast{position:absolute;left:14px;right:14px;bottom:18px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:none}

/* عناصر مشتركة */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h4{margin:0 0 6px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;background:var(--teal-d);color:#fff;width:100%}
.btn.alt{background:var(--surface);color:var(--teal-d);border:1.5px solid var(--teal)}
.btn.gold{background:var(--gold);color:#3b2b00}
.btn.purple{background:var(--purple)}
.btn[disabled]{background:#C9D1DB;color:#fff;cursor:not-allowed}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.p-ok{background:#DDF3EC;color:var(--green)} .p-wait{background:#FFF3D1;color:var(--gold-d)} .p-no{background:#FDE3E8;color:#B3243F} .p-info{background:var(--tint);color:var(--teal-d)} .p-pur{background:#F4E1F1;color:var(--purple)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 12px;text-align:right;font-weight:700;color:var(--navy);display:flex;flex-direction:column;gap:6px;font-size:14px}
.tile i{width:34px;height:34px;border-radius:10px;display:block}
.tile.new{border-color:var(--teal);box-shadow:0 0 0 2px var(--tint)}
.tile .tag{font-size:11px;font-weight:800;color:var(--teal-d)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.field input,.field select,.field textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;color:var(--navy)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:700}
.chk input{width:20px;height:20px;accent-color:var(--teal-d)}
.chk.on{border-color:var(--teal);background:var(--tint)}

/* الأسابيع */
.kidtabs{display:flex;gap:6px}
.kidtabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-weight:700;color:var(--navy);font-size:13.5px}
.kidtabs button.on{border-color:var(--purple);background:#F4E1F1;color:var(--purple)}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wk{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:right;color:var(--navy)}
.wk b{display:block;font-size:14px}
.wk span{font-size:12px;color:var(--muted)}
.wk.on{border-color:var(--teal-d);background:var(--tint)}
.wk.on b::after{content:" ✓";color:var(--teal-d)}
.wk.full{opacity:.55;cursor:not-allowed}
.sum{display:flex;flex-direction:column;gap:6px;font-size:14px}
.sum .row b{font-variant-numeric:tabular-nums}
.sum .tot{border-top:1px dashed var(--line);padding-top:8px;font-size:16px;font-weight:800}
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.timeline div{border-radius:10px;padding:8px 2px;text-align:center;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--muted);line-height:1.35}
.timeline div.paid{background:var(--teal-d);color:#fff}

/* الطالب */
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-opts button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;gap:6px}
.q-opts button .img{width:100%;aspect-ratio:4/3;border-radius:10px}
.q-opts button.on{border-color:var(--purple);background:#F4E1F1}
.order button{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;color:var(--navy);margin-bottom:6px}
.order button .k{width:24px;height:24px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px}
.order button.on .k{background:var(--purple);color:#fff}
.timer{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.score{text-align:center;padding:20px 10px}
.score .big{font-size:44px;font-weight:800;color:var(--purple);line-height:1.1}

/* الموظف */
.att{width:100%;border-collapse:collapse;font-size:12.5px}
.att th,.att td{border-bottom:1px solid var(--line);padding:6px 2px;text-align:center}
.att th:first-child,.att td:first-child{text-align:right;padding-right:4px}
.att button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:12px;color:var(--muted)}
.att button.p{background:#DDF3EC;border-color:var(--green);color:var(--green)}
.att button.l{background:#FFF3D1;border-color:var(--gold);color:var(--gold-d)}
.att button.e{background:var(--tint);border-color:var(--teal);color:var(--teal-d)}
.ai.navy{background:#E7EDF4;color:#1A3A5C}.ai.green{background:#DDF3EC;color:#0D7C66}.ai.pink{background:#FDE3E8;color:#B3243F}
.shotbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1A3A5C;color:#fff;font-size:12.5px;font-weight:700}.shotbar button{white-space:nowrap;flex:0 0 auto;background:#fff;color:#1A3A5C;border:0;border-radius:999px;padding:3px 12px;font:inherit;font-weight:800;cursor:pointer}
.shotbody{flex:1;overflow-y:auto;position:relative;background:#F7F9FC}.shotwrap{position:relative}.shotwrap img{display:block;width:100%}
.hot{position:absolute;inset-inline:3.89%;border:2.5px solid #ECB831;border-radius:14px;background:rgba(236,184,49,.12);cursor:pointer;font:inherit}.hot i{position:absolute;top:-11px;inset-inline-end:10px;background:#ECB831;color:#3d2d00;font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:1px 9px}
.minik{display:flex;gap:8px}.minik .mk{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:16px;padding:10px 12px;box-shadow:0 2px 12px rgba(26,58,92,.07);font:inherit;text-align:right;cursor:pointer}.minik .kav{flex:0 0 36px}.minik .mt{min-width:0}.minik b{display:block;font-size:14px;color:var(--navy)}.minik span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.ecbtn{display:flex;gap:8px}.ecbtn button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;font:inherit;font-size:13px;font-weight:700;color:var(--purple)}
.linkb{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--teal-d);text-decoration:underline;cursor:pointer}
.att button.a{background:#FDE3E8;border-color:var(--pink);color:#B3243F}
.sheet{position:absolute;inset:0;background:rgba(13,27,42,.45);display:flex;align-items:flex-end;z-index:4}
.sheet .in{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px}

/* لوحة الموقع */
.web{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(26,58,92,.12)}
.webtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(135deg,var(--teal),#3a8fb7 60%,var(--purple));color:#fff;font-size:13.5px;font-weight:700}
.webtop .sp{flex:1}
.who{display:flex;background:rgba(255,255,255,.18);border-radius:12px;padding:3px}
.who button{border:0;background:transparent;color:#fff;font-weight:700;border-radius:9px;padding:5px 12px;font-size:13px}
.who button.on{background:#fff;color:var(--purple)}
.webbody{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:560px}
@media (max-width:760px){.webbody{grid-template-columns:minmax(0,1fr)}}
.side{border-left:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;background:#FBFCFE}
@media (max-width:760px){.side{flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line)}}
.side img{width:110px;margin:0 auto 10px}
@media (max-width:760px){.side img{display:none}}
.side button{border:0;background:transparent;text-align:right;padding:9px 12px;border-radius:10px;font-weight:700;color:var(--navy);font-size:14px;white-space:nowrap}
.side button.on{background:var(--tint);color:var(--teal-d)}
.main{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.main h2{margin:0;font-size:20px}
.flow{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.flow span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted);background:#fff}
.flow span.on{border-color:var(--teal);color:var(--teal-d);background:var(--tint)}
.flow span.ok{border-color:var(--green);color:var(--green);background:#E8F6F1}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.t th{background:var(--navy);color:#fff;font-weight:700;padding:9px 12px;text-align:right}
table.t td{padding:9px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr.bad td{background:#FFF4F6}
.cycle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cycle{grid-template-columns:minmax(0,1fr)}}
.cycle button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;text-align:right;color:var(--navy);display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.cycle button b{font-size:14px}
.cycle button span{color:var(--muted);padding-right:12px;position:relative}
.cycle button span::before{content:"";position:absolute;right:0;top:.62em;width:6px;height:6px;border-radius:50%;background:#C9D1DB}
.cycle button span.nw{color:var(--teal-d);font-weight:700}
.cycle button span.nw::before{background:var(--teal)}
.cycle button.on{border-color:var(--teal);background:var(--tint)}
.dev{grid-column:1/-1;display:inline-flex;justify-self:start;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.dev button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.dev button.on{background:#fff;color:var(--teal-d);box-shadow:0 1px 4px rgba(26,58,92,.12)}
.site{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(26,58,92,.12)}
.sitebar{display:flex;align-items:center;gap:6px;background:var(--soft);padding:8px 14px;font-size:12px;color:var(--muted)}
.sitebar i{width:9px;height:9px;border-radius:50%;background:#C9D1DB}
.sitebar span{margin-inline-start:8px}
.sitein{border-radius:0;height:auto;min-height:560px}
.sitehead{display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(135deg,var(--teal),#3a8fb7 60%,var(--purple));color:#fff;font-size:14px}
.sitehead .lg{background:#fff;border-radius:10px;padding:4px 8px;display:flex}
.sitehead img{height:30px;width:auto}
.sitebody{width:100%;max-width:720px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sitebody h2{margin:0;font-size:20px}
.sitebody .body{overflow:visible;padding:0}
.sitebody .lnk{align-self:flex-start;border:0;background:transparent;color:var(--teal-d);font-weight:700;padding:0;font-size:14px}
.sitein .weeks{grid-template-columns:repeat(3,minmax(0,1fr))}
.sitein .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.sitein .weeks,.sitein .tiles{grid-template-columns:1fr 1fr}}
.web.narrow{max-width:400px;margin:0 auto;width:100%}
.narrow .webbody{grid-template-columns:minmax(0,1fr)}
.narrow .side{flex-direction:row;overflow-x:auto;border-left:0;border-bottom:1px solid var(--line)}
.narrow .side img{display:none}
.narrow .cycle{grid-template-columns:minmax(0,1fr)}
.narrow .main{padding:14px}
/* الموقع بشكله الحقيقي */
.rs{border-radius:0;height:auto;min-height:600px;background:#fff;color:#333;overflow:visible}
.rs-nav{display:flex;align-items:center;gap:16px;padding:6px 24px;border-bottom:1px solid rgba(26,58,92,.06);box-shadow:0 2px 24px rgba(26,58,92,.05);background:#fff}
.rs-nav img{height:64px;width:auto}
.rs-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.rs-links a{color:var(--navy);font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px}
.rs-user{background:rgba(26,58,92,.06);border:1px solid rgba(26,58,92,.12);color:var(--navy);border-radius:50px;padding:7px 16px;font-weight:700;font-size:13.5px;white-space:nowrap}
@media (max-width:820px){.rs-links{display:none}.rs-nav{justify-content:space-between}}
.rs-page{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:28px 20px 36px;display:flex;flex-direction:column;gap:16px}
.rs-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rs-h h4{margin:0;font-size:22px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.rs-h h4 i{width:14px;height:14px;border-radius:4px;background:var(--gold);display:block}
.rs-out{border:1px solid #6c757d;background:#fff;color:#495057;border-radius:8px;padding:6px 14px;font-weight:600;font-size:13.5px}
.rs-out.w,.rs-gold.w{width:100%;padding:14px;font-size:16px;margin-top:8px}
.rs-gold{background:linear-gradient(135deg,#ECB831,#f0c040);color:#1A3A5C;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:15px}
.rs-gold[disabled]{background:#dfe3e8;color:#fff;cursor:not-allowed}
.rs-prog{display:flex;justify-content:space-between;position:relative;margin:4px 0 8px}
.rs-prog::before{content:"";position:absolute;top:18px;left:12%;right:12%;height:2px;background:#e9ecef}
.rs-prog .st{position:relative;text-align:center;flex:1}
.rs-prog .c{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #e9ecef;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:700;color:#adb5bd}
.rs-prog .active .c{background:linear-gradient(135deg,#ECB831,#f0c040);border-color:#ECB831;color:#1A3A5C;box-shadow:0 4px 12px rgba(236,184,49,.35)}
.rs-prog .done .c{background:#2BBCB3;border-color:#2BBCB3;color:#fff}
.rs-prog .l{font-size:11px;font-weight:600;color:#6c757d}
.rs-prog .active .l{color:#1A3A5C}
.rs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:820px){.rs-grid{grid-template-columns:minmax(0,1fr)}}
.rs-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rs-card.off{opacity:.6}
.rs-mid{max-width:560px;width:100%;margin:0 auto}
.rs-center{text-align:center;align-items:center}
.rs-kid{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.rs-kid>div:not(.rs-av){flex:1;min-width:0}
.rs-kid h5,.rs-t{margin:0;font-size:18px;font-weight:700;color:var(--navy)}
.rs-kid small{color:#6c757d;font-size:13px}

function shotScreen(k,back,hot){
  return `<div class="phoneWrap"><div class="phone"><div class="screen">
    <div class="sbar ${S.role==='emp'?'on-pur':''}"><span>9:41</span><span></span></div>
    <div class="shotbar"><button data-act="${back}">→ رجوع</button><span><b>${SHOTS[k]}</b> · موجودة اليوم كما هي</span></div>
    <div class="shotbody"><div class="shotwrap"><img src="${SHOTIMG[k]}" alt="${SHOTS[k]}">${(hot||[]).map(h=>`<button class="hot" style="top:${h[0]}%;height:${h[1]}%" data-act="${h[2]}" aria-label="${h[3]}"><i>${h[3]}</i></button>`).join('')}</div></div>
    ${tabbar()}<div class="toast" role="status" aria-live="polite"></div></div></div></div>`;
}
function steps(title, hint, list, cur, key){
  return `<aside class="steps"><h3>${title}</h3><p class="hint">${hint}</p>${list.map((x,i)=>`<button data-jump="${key}:${x.id}" class="${x.id===cur?'on':''}"><span class="n">${ar(i+1)}</span><span><span class="t">${x.t}</span><span class="d">${x.d}</span></span></button>`).join('')}</aside>`;
}

/* ===== ولي الأمر ===== */
function pTotals(){
  const P=S.p; let weeks=0, sub=0;
  P.kids.filter(k=>k.on).forEach(k=>{weeks+=k.w.length; sub+=priceOf(k.w.length);});
  const disc=P.codeState==='ok'?Math.round(sub*0.10):0, tax=Math.round((sub-disc)*15)/100;
  return {weeks,sub,disc,tax,tot:sub-disc+tax};
}
function sumBox(){
  const T=pTotals(), P=S.p;
  return `<div class="card sum">
    ${P.kids.filter(k=>k.on).map(k=>`<div class="row"><span>${k.name}: ${k.w.length?(k.w.length>1?'الأسابيع ':'الأسبوع ')+k.w.slice().sort().map(i=>ar(i+1)).join('، '):'لا شيء'}</span><b>${ar(priceOf(k.w.length))}</b></div>`).join('')}
    ${T.disc?`<div class="row" style="color:var(--green)"><span>خصم الكود</span><b>− ${ar(T.disc)}</b></div>`:''}
    <div class="row muted"><span>الضريبة (15% مثال، حسب إعداد الفرع)</span><b>${m(T.tax)}</b></div>
    <div class="row tot"><span>الإجمالي المستحق</span><b>${m(T.tot)}</b></div></div>`;
}

const rsHead=(t,back)=>`<div class="rs-h"><h4><i></i>${t}</h4>${back?`<button class="rs-out" data-act="${back}">→ الرئيسية</button>`:''}</div>`;
const rsProg=n=>`<div class="rs-prog">${['مراجعة التفاصيل','الدفع','التأكيد'].map((l,i)=>`<div class="st ${i+1<n?'done':i+1===n?'active':''}"><div class="c">${i+1<n?'✓':i+1}</div><div class="l">${l}</div></div>`).join('')}</div>`;
function rsSum(){
  const T=pTotals();
  return `<div class="rs-sum"><div class="ln"><span>المبلغ الأساسي</span><b>${m(T.sub)}</b></div>${T.disc?`<div class="ln"><span>الخصم <em>كود خصم</em></span><b style="color:#0D7C66">- ${m(T.disc)}</b></div>`:''}<div class="ln"><span>الضريبة (15%)</span><b>${m(T.tax)}</b></div><div class="ln total"><span>الإجمالي المستحق</span><span>${m(T.tot)}</span></div></div>`;
}
const wkNames=k=>k.w.length?k.w.slice().sort().map(i=>WEEKS[i].n).join(' + '):'لم تختر بعد';
function parentWeb(){
  const P=S.p, T=pTotals(), on=P.kids.filter(k=>k.on);
  const av=k=>`<div class="rs-av">${k.name[0]}</div>`;
  switch(P.step){
  case 'home': return rsShell(`${rsHead('لوحتي')}
    ${P.pending&&!P.paid?`<div class="rs-alert"><div><b>عندك طلب محفوظ بانتظار الدفع</b><span>أسابيعك المختارة محفوظة. عند الدفع نتأكد من توفرها وسعرها.</span></div><button class="rs-gold" data-act="p:resume">أكمل الدفع</button></div>`:''}
    <div class="rs-grid">${P.kids.map(k=>`<div class="rs-card"><div class="rs-kid">${av(k)}<div><h5>${k.name} أحمد</h5><small>فرع النرجس</small></div><span class="rs-tag ok">ساري</span></div>
      <div class="rs-date"><span class="lbl">${k.paid?'تم التجديد':'ينتهي الاشتراك الحالي'}</span><span class="val">${k.paid?wkNames(k):'2026-06-18'}</span></div>${k.paid?'':`<button class="rs-gold w" style="margin-top:10px" data-act="p:renew_${P.kids.indexOf(k)}">تجديد ${k.name}</button>`}</div>`).join('')}</div>
    <div class="rs-actions"><button class="rs-out" data-act="p:reg">تسجيل ابن جديد</button><button class="rs-out" data-act="p:details">تفاصيل اشتراك سارة</button></div>
    <h5 class="rs-t" style="margin-top:18px">خدماتك <span class="oldtag">مقتطف من لوحتكم الحالية، تبقى كما هي</span></h5>
    <div class="rs-svc">${['المناداة','الرحلات','الرابح الأكثر','المقصف','المدفوعات','الاشتراكات'].map(x=>`<button data-act="p:noop">${x}</button>`).join('')}</div>
    <p class="rs-note">نفس الخطوات من الموقع، على الكمبيوتر أو الجوال.</p>`);
  case 'reg': return rsShell(`${rsHead('تسجيل ابن جديد','p:home')}${rsProg(1)}
    <div class="rs-card rs-mid"><h5 class="rs-t">بيانات الابن</h5>
      <label class="rs-lbl">اسم الابن</label><div class="rs-code"><input id="rn" value="نورة أحمد"></div>
      <label class="rs-lbl">الفرع</label><div class="rs-code"><input value="فرع النرجس"></div>
      <p class="rs-note">بقية بيانات التسجيل الحالية كما هي. بعدها يختار الأسابيع، ويكتب كود الخصم، ويدفع الآن أو لاحقاً.</p>
      <button class="rs-gold w" data-act="p:regnext">التالي: اختيار الأسابيع</button></div>`);
  case 'kids': case 'weeks': return rsShell(`${rsHead('تجديد الاشتراك','p:home')}${rsProg(1)}
    <div class="rs-grid">${P.kids.map((k,ki)=>`<div class="rs-card ${k.on?'':'off'}"><div class="rs-kid">${av(k)}<div><h5>${k.name} أحمد</h5><small>فرع النرجس</small></div><label class="rs-inc"><input type="radio" name="kidw" data-kid="${ki}" ${k.on?'checked':''}> تجديد</label></div>
      ${k.on?`<label class="rs-lbl">اختر الأسابيع — متصلة أو متفرقة</label>
      <div class="rs-pick">${WEEKS.map((w,i)=>{const own=(k.own||[]).includes(i);return `<button class="${k.w.includes(i)?'on':''} ${own?'own':''}" data-k="${ki}" data-wk="${i}"><span class="t">${w.n}</span><span class="d">${own?'مدفوع سابقاً':w.d}</span></button>`;}).join('')}</div>
      <div class="rs-date new"><span class="lbl">الأسابيع المختارة</span><span class="val">${wkNames(k)}</span></div>
      <div class="rs-sum"><div class="ln"><span>${k.w.length} أسابيع — من جدول أسعار الفرع</span><b>${m(priceOf(k.w.length))}</b></div></div>`:'<p class="rs-note">غير مشمول في هذا الطلب.</p>'}</div>`).join('')}</div>
    <div class="rs-bar"><div><b>${m(T.sub)}</b><span>قبل الضريبة — كل أسابيع ${on.map(k=>k.name).join('')} بدفعة واحدة</span></div><button class="rs-gold" data-act="p:progs" ${T.weeks?'':'disabled'}>التالي: برامج الفرع</button></div>`);
  case 'progs': return rsShell(`${rsHead('تجديد الاشتراك','p:home')}${rsProg(1)}
    <div class="rs-card rs-mid"><h5 class="rs-t">برامج فرع النرجس <span class="oldtag" style="background:#FFF3D1;color:#8A6400">جديد</span></h5>
      <p class="rs-note">وش يشمل اشتراكك في هذا الفرع:</p>
      ${S.a.progs.filter(x=>x.on).map(x=>`<div class="rs-date new"><span class="lbl">✓</span><span class="val">${x.n}</span></div>`).join('')}
      ${S.a.progs.some(x=>!x.on)?`<p class="rs-note">ما يشمله هذا الفرع: ${S.a.progs.filter(x=>!x.on).map(x=>x.n).join('، ')}</p>`:''}
      <button class="rs-gold w" data-act="p:summary">التالي: الملخص والدفع</button></div>
    <button class="rs-back" data-act="p:weeks">→ تعديل الأسابيع</button>`);
  case 'summary': return rsShell(`${rsHead('تجديد الاشتراك','p:home')}${rsProg(1)}
    <div class="rs-card rs-mid"><h5 class="rs-t">ملخص الطلب</h5>
      ${on.map(k=>`<div class="rs-date new"><span class="lbl">${k.name} أحمد</span><span class="val">${wkNames(k)}</span></div>`).join('')}
      <label class="rs-lbl" for="code">كود الخصم</label>
      <div class="rs-code"><input id="code" value="${P.code}" placeholder="اكتب الكود"><button class="rs-out" data-act="p:code">تطبيق</button></div>
      ${P.codeState==='ok'?'<p class="rs-okmsg">تم تطبيق الخصم 10%</p>':P.codeState==='bad'?'<p class="rs-badmsg">الكود لا ينطبق على هذا الطلب</p>':'<p class="rs-note">جرّب: NAWADI — وخصم الإخوة وشروط الخصومات تبقى على قواعدكم الحالية.</p>'}
      ${rsSum()}
      <button class="rs-gold w" data-act="p:pay">ادفع الآن بالبطاقة</button>
      <button class="rs-out w" data-act="p:later">ادفع لاحقاً</button>
      <small class="rs-safe">دفعة واحدة لكل الأسابيع المختارة · الدفع آمن ومشفّر</small></div>
    <button class="rs-back" data-act="p:weeks">→ تعديل الأسابيع</button>`);
  case 'pay': return rsShell(`${rsHead('تجديد الاشتراك','p:home')}${rsProg(2)}
    <div class="rs-card rs-mid"><h5 class="rs-t">الدفع</h5>${rsSum()}
      <label class="rs-radio on"><input type="radio" name="pmw" checked> بطاقة مدى أو ائتمانية</label>
      <p class="rs-note">ووسائل الدفع الأخرى المفعّلة عندكم اليوم تبقى كما هي.</p>
      <button class="rs-gold w" data-act="p:done">تأكيد الدفع</button></div>`);
  case 'done': return rsShell(`${rsHead('تجديد الاشتراك')}${rsProg(4)}
    <div class="rs-card rs-mid rs-center"><div class="rs-check">✓</div><h5 class="rs-t">تم تجديد الاشتراك بنجاح</h5><p class="rs-note">وصلتكم الفاتورة، والأسابيع ظاهرة في تفاصيل الاشتراك.</p>
      <button class="rs-gold w" data-act="p:details">عرض تفاصيل الاشتراك</button><button class="rs-out w" data-act="p:home">الرئيسية</button></div>`);
  case 'later': return rsShell(`${rsHead('تم حفظ طلبك','p:home')}
    <div class="rs-card rs-mid"><div class="rs-kid"><div><h5>طلبك محفوظ</h5><small>ترجع له أي وقت من «لوحتي»</small></div><span class="rs-tag wait">بانتظار الدفع</span></div>
      ${on.map(k=>`<div class="rs-date"><span class="lbl">${k.name} أحمد</span><span class="val">${wkNames(k)}</span></div>`).join('')}${rsSum()}

      <button class="rs-gold w" data-act="p:home">الرجوع للوحتي</button></div>`);
  case 'resume': return rsShell(`${rsHead('إكمال الدفع','p:home')}${rsProg(1)}
    <div class="rs-card rs-mid"><div class="rs-date new"><span class="lbl">تحققنا من طلبك</span><span class="val">الأسابيع ما زالت متاحة، والسعر والكود كما هي</span></div>${rsSum()}
      <button class="rs-gold w" data-act="p:pay">ادفع الآن بالبطاقة</button></div>`);
  case 'details': { const kk=P.kids[P.kid]; return rsShell(`${rsHead('تفاصيل الاشتراك','p:home')}
    <div class="rs-card rs-mid"><div class="rs-kid">${av(kk)}<div><h5>${kk.name} أحمد</h5><small>فرع النرجس — الموسم الصيفي</small></div><span class="rs-tag ok">مدفوع</span></div>
      <div class="timeline">${WEEKS.map((w,i)=>`<div class="${kk.w.includes(i)?'paid':''}">${w.n.replace('الأسبوع ','أسبوع ')}<br>${kk.w.includes(i)?'مشترك':'—'}</div>`).join('')}</div>
      ${kk.w.slice().sort().map(i=>`<div class="rs-date new"><span class="lbl">${WEEKS[i].n}</span><span class="val">${WEEKS[i].d}</span></div>`).join('')}

      <div class="rs-actions"><button class="rs-out" data-act="p:inv">تحميل الفاتورة PDF</button><button class="rs-out" data-act="p:share">مشاركة</button></div></div>`); }
  }
}

            ['clr','نهاية الفترة: الكشف والجرد والإخلاء',[['مسؤول العهد يرسل للمدير كشفاً بعهدة الفرع: القديمة والمشتراة',1],['المدير يطابق الكشف بالأعداد اللي عنده ويرسله',1],['مسؤول العهد يجرد ويشوف الناقص',0],['إعادة للاستكمال مع ملاحظة النقص',0],['المدير يسجل السبب: تالف، مفقود، غير صالح',1],['يرجع الكشف لمسؤول العهد ويُحفظ في النظام',0]]]];
  return `<div class="cycle">${ph.map(p=>`<button data-sec="${p[0]}" class="${sec===p[0]?'on':''}"><b>${p[1]}</b>${p[2].map(x=>`<span class="${x[1]?'nw':''}">${x[0]}</span>`).join('')}</button>`).join('')}</div><p class="muted" style="margin:0">نفس ترتيب مخططكم وملاحظاتكم: تبدأ من طلب مدير الفرع، وغير المتوفر يشتريه الفرع أثناء العمل ويدخل عهدة عليه. وأثناء العمل كل شراء يتسجل أول بأول. وفي نهاية الفترة يرسل مسؤول العهد للمدير كشفاً بكل عهدته القديمة والمشتراة، يطابقه المدير ويرجعه، وتنتهي بحفظ الكشف في النظام. الملوّن جديد، والباقي يعمل عندكم اليوم، ومتابعة عهد الفروع مستمرة طول الفترة.</p>`;

/* ===== العرض ===== */
function dev(key,opts){return `<div class="dev" role="group" aria-label="طريقة العرض">${opts.map(o=>`<button data-view="${o[0]}" class="${S.view[key]===o[0]?'on':''}">${o[1]}</button>`).join('')}</div></div>${(S.view[key]==='web'||S.view[key]==='pc')?'<p class="devhint">هذا شكل شاشة الكمبيوتر. كبّروها بإصبعين، أو افتحوا الرابط من الكمبيوتر لتجربة أوضح.</p>':''}`;}
function render(){
  document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-selected',b.dataset.role===S.role));
  const st=$('#stage');
  st.className='stage'+((S.role==='admin'||(S.role==='parent'&&S.view.parent==='web'))?' wide':'');
  if(S.role==='parent') st.innerHTML=dev('parent',[['app','التطبيق على الجوال'],['web','الموقع على الكمبيوتر']])+parentScreen()+steps('رحلة ولي الأمر','يختار الأسابيع اللي يبيها ويدفع مرة وحدة، من التطبيق أو الموقع.',P_STEPS,S.p.step==='done'?'pay':S.p.step==='resume'?'later':S.p.step,'p');
  if(S.role==='student') st.innerHTML=studentScreen()+steps('رحلة الطالب','الطالب يدخل بحسابه ويشارك من التطبيق.',S_STEPS,S.s.step,'s');
  if(S.role==='emp') st.innerHTML=empScreen()+steps('رحلة الموظف','ينجز شغله من التطبيق نفسه، بدون انتقال للموقع.',E_STEPS,S.e.step,'e');
  if(S.role==='admin') st.innerHTML=dev('admin',[['pc','على الكمبيوتر'],['mob','على الجوال']])+adminScreen();
  fit();
}
function fit(){document.querySelectorAll('.desk').forEach(d=>{const i=d.firstElementChild, k=Math.min(1,(d.clientWidth-20)/1240); i.style.transform='scale('+k+')'; d.style.height=(i.offsetHeight*k+20)+'px';});}
window.addEventListener('resize',fit); window.addEventListener('load',fit); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-kid],[data-call]');
  if(!b) return;
  const d=b.dataset, P=S.p, T=S.s, E=S.e, A=S.a;
  if(d.role){S.role=d.role;S.p.shot=null;S.e.shot=null;render();return;}
  if(d.jump){S.p.shot=null;S.e.shot=null;const [k,id]=d.jump.split(':'); ({p:P,s:T,e:E})[k].step=id; if(k==='p'&&id==='details')P.paid=true; render(); return;}
  if(d.view){S.view[S.role]=d.view;render();return;}
  if(d.k!==undefined){S.p.kid=+d.k;}
  if(d.kidtab!==undefined){P.kid=+d.kidtab;render();return;}
  if(d.wk!==undefined){const i=+d.wk; const k=P.kids[P.kid]; if((k.own||[]).includes(i)){toast('هذا الأسبوع مدفوع لـ'+k.name+' من قبل، وما يتكرر شراؤه');return;} if(k.w.includes(i)) k.w=k.w.filter(x=>x!==i); else { if(k.w.length>=6) return; k.w.push(i);} P.codeState=P.codeState; render(); return;}
  if(d.ans!==undefined){T.a=+d.ans;render();return;}
  if(d.ord!==undefined){const i=+d.ord; T.ord=T.ord.includes(i)?T.ord.filter(x=>x!==i):[...T.ord,i]; render();return;}
  if(d.att){const v=E.att[d.att]??(+d.att.split('-')[1]<2?'p':''); E.att[d.att]=({p:'a',a:'l',l:'e',e:''})[v]??'p'; render();return;}
  if(d.nav){A.navOpen[d.nav]=!A.navOpen[d.nav];render();return;}
  if(d.who){A.who=d.who;render();return;}
  if(d.sec){A.sec=d.sec;render();return;}
  if(d.delrow!==undefined){A.rows.splice(+d.delrow,1);render();return;}
  if(d.buyin!==undefined){if(A.clItems){ if(A.cl!=='check'){webToast('الكشف في مرحلة الجرد. يدخل هذا الشراء بعد حفظ الكشف');return;} const p=A.purch[+d.buyin]; p.st='in'; A.clItems.push({name:p.item,src:'مشتريات أثناء العمل',given:p.qty,ret:p.qty}); render(); webToast('دخل الشراء على الفرع، وانضاف للكشف المرسل للمدير'); return;}A.purch[+d.buyin].st='in';render();webToast('دخل الصنف على الفرع وحُفظ');return;}
  const act=d.act; if(!act) return;
  const [k,a]=act.split(':');
  if(k==='p'){
    if(a==='noop'){toast('هذي الخدمة موجودة عندكم اليوم وتبقى كما هي');return;}
    if(a.startsWith('shot_')){P.shot=a.slice(5);render();return;}
    if(a.startsWith('renew_')){const i=+a.slice(6); P.kids.forEach((x,j)=>x.on=j===i); P.kid=i; P.shot=null; P.step='weeks'; render(); return;}
    if(a==='unshot'){P.shot=null;render();return;}
    if(a==='tripok'){toast('تم تسجيل موافقتك على مشاركة سارة');P.step='trips';render();return;}
    if(a==='tripno'){toast('تم تسجيل رفضك');P.step='trips';render();return;}
    if(a==='regnext'){const nm=(($('#rn')?.value||'نورة أحمد').trim().split(' ')[0])||'نورة'; let i=P.kids.findIndex(x=>x.isNew); if(i<0){P.kids.push({name:nm,on:true,w:[],isNew:true}); i=P.kids.length-1;} else P.kids[i].name=nm; P.kids.forEach(x=>x.on=!!x.isNew); P.kid=i; P.step='weeks'; render(); return;}
    if(a==='code'){const v=($('#code')?.value||'').trim(); P.code=v; P.codeState=v.toUpperCase()==='NAWADI'?'ok':v?'bad':''; render(); return;}
    if(a==='later'){P.pending=true;P.saved=P.kid;P.paid=false;P.step='later';render();return;}
    if(a==='resume'){if(P.saved!=null){P.kids.forEach((x,j)=>x.on=j===P.saved);P.kid=P.saved;} P.step='resume';render();return;}
    if(a==='done'){P.kids.forEach(x=>{if(x.on)x.paid=true;});P.paid=true;P.pending=false;P.step='done';render();return;}
    if(a==='inv'){toast('تم تحميل الفاتورة PDF');return;}
    if(a==='share'){toast('اختر التطبيق للمشاركة');return;}
    if(a==='details')P.paid=true;
    P.shot=null; P.step=a; render(); return;
  }
  if(k==='s'){ if(a==='noop'){toast('واجهة الطالب جديدة في التطبيق: المسابقات والرابح الأكثر');return;} if(a==='redeem'){T.redeemed=true;render();toast('تم استبدال المكافأة، وتسلّمها من الفرع');return;} if(a==='card'){T.csheet=true;render();return;} if(a==='cclose'){T.csheet=false;render();return;} if(a==='docard'){T.csheet=false;render();toast('تم شحن البطاقة وإضافة نقاطها');return;} if(a==='list'){T.a=null;T.ord=[];} T.step=a; render(); return; }
  if(k==='e'){
    if(a.startsWith('shot_')){E.shot=a.slice(5);render();return;}
    if(a==='unshot'){E.shot=null;render();return;}
    if(a==='noop'){toast('هذي الخدمة موجودة اليوم في التطبيق');return;}
    if(a==='save'){toast('تم حفظ الحضور');return;}
    if(a==='pdf'){toast('تم تحميل كشف الحضور PDF');return;}
    if(a==='dl'){toast('تم تحميل العقد PDF');return;}
    if(a==='share'){toast('اختر التطبيق للمشاركة');return;}
    if(a==='all'){E.calls=E.calls.map((x,i)=>!E.gone.includes(i));render();return;}
    if(a==='confirm'){E.sheet=true;render();return;}
    if(a==='close'){E.sheet=false;render();return;}
    if(a==='doconfirm'){const n=E.calls.filter((x,i)=>x&&i!==3).length, f=E.calls[3]; E.calls.forEach((x,i)=>{if(x&&i!==3)E.gone.push(i);}); E.sheet=false;E.calls=E.calls.map(()=>false);render();toast(`تم تأكيد تسليم ${ar(n)}`+(f?'، وطلب واحد لم يُنفذ لأنه سُلّم سابقاً':''));return;}
    if(a==='send'){toast('أُرسلت المبادرة للمراجعة');return;}
    if(a==='codebox'){E.shot=null;E.step='code';render();return;}
    if(a==='askcharge'){E.csheet=true;render();return;}
    if(a==='cclose'){E.csheet=false;render();return;}
    if(a==='charge'){E.charged=true;E.csheet=false;render();toast('تم شحن الرصيد بنجاح');return;}
    E.shot=null; E.step=a; render(); return;
  }
  if(k==='a'){
    if(a==='noop'){webToast('هذي الصفحة موجودة في لوحتكم اليوم، وتبقى كما هي');return;}
    if(a==='reqsend'){A.reqSent=true;render();webToast('أُرسل الطلب لمسؤول العهد');return;}
    if(a==='ack'){A.ack=true;render();webToast('تم الإقرار بالاستلام');return;}
    if(a==='issue'){A.issued=true;render();webToast('صدر سند التسليم بالأصناف المتوفرة');return;}
    if(a==='buyadd'){const it=$('#b1').value.trim()||'صنف'; A.purch.push({item:it,qty:Math.max(1,Math.floor(+($('#b2').value)||1)),cond:$('#b3').value,place:$('#b4').value||'—',note:$('#b5').value||'',st:'wait'}); render(); webToast('سُجّل الشراء ووصل لمسؤول العهد آلياً'); return;}
    if(a==='progadd'){const v=($('#pn').value||'').trim(); if(v){A.progs.push({n:v,on:true}); render(); webToast('أُضيف البرنامج');} return;}
    if(a==='progsave'){webToast('حُفظت برامج الفرع، وتنعكس في الموقع والتطبيق');return;}
    if(a==='additem'){const q=Math.max(1,Math.floor(+($('#c3').value)||1)); A.rows.push({cat:$('#c1').value,item:$('#c2').value,qty:q,note:$('#c4').value.trim()}); render(); webToast('أُضيف الصنف للطلب'); return;}
    if(a==='report'){webToast('يوصل بلاغك لمسؤول العهد مثل اليوم');return;}
    if(a==='sendlist'){A.clItems=clItems();A.cl='check';render();webToast('أُرسل الكشف لمدير الفرع');return;}
    if(a==='sendcheck'){A.clItems.forEach(r=>r.mg=r.ret);A.cl='count';render();webToast('وصل الكشف لمسؤول العهد');return;}
    if(a==='back'){A.cl='back';render();webToast('أُعيد الكشف لمدير الفرع مع ملاحظة النقص');return;}
    if(a==='endcount'){A.cl='sign';render();webToast('وصل الكشف لمدير الفرع للتوقيع');return;}
    if(a==='clrsend'){A.clItems.forEach((r,i)=>{if(A.reasons[i]==='استكملت النقص وسلّمته'){r.ret=r.given;A.reasons[i]='استُكمل';}});A.cl='sent';render();webToast('رجع الكشف لمسؤول العهد');return;}
    if(a==='clrok'){A.cl='ok';render();webToast('حُفظ الكشف في النظام');return;}
    if(a==='clreset'){A.cl='list';A.clItems=null;A.reasons={};A.just='';A.sign=false;render();return;}
    if(a==='toggle'){A.open=!A.open;A.log.unshift((A.open?'تم الفتح':'تم الإغلاق')+' — مسؤول النظام — الآن');render();return;}
  }
});
document.addEventListener('change',e=>{
  const t=e.target, P=S.p, E=S.e, A=S.a;
  if(t.dataset.kid!==undefined){const i=+t.dataset.kid; P.kids.forEach((x,j)=>x.on=j===i); P.kid=i; P.codeState=''; render();}
  if(t.dataset.call!==undefined){E.calls[+t.dataset.call]=t.checked;render();}
  if(t.id==='sign'){A.sign=t.checked;render();}
  if(t.id==='pledge'){A.pledge=t.checked;render();}
  if(t.dataset.cnt!==undefined){const r=A.clItems[+t.dataset.cnt]; r.ret=Math.max(0,Math.floor(+t.value||0)); render();}
  if(t.dataset.rsn!==undefined){A.reasons[t.dataset.rsn]=t.value; render();}
  if(t.dataset.prog!==undefined){A.progs[+t.dataset.prog].on=t.checked;render();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='just'){S.a.just=e.target.value; return; const btn=document.querySelector('[data-act="a:clrsend"]'); if(btn) btn.disabled=!clrReady();}
});
render();
})();
</script>
